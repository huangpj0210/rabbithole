# rabbithole 服务端配置示例。所有键均可省略(见 config.rs 默认值)。
bind_addr = "0.0.0.0"
bind_protocol = "tcp"
bind_port = 7100
multiplex = true

[web]
bind_addr = "127.0.0.1"
port = 8080
# static_dir = "./console/dist"   # 可选:不配置时使用构建期内嵌的控制台(console/dist 存在时已嵌入)

[vhost]
http_port = 8081
https_port = 0
tcpmux_port = 8082
subdomain_host = "rabbithole.test"

[ports]
auto_range = "10000-25000"

[limits]
# 并发上限默认全部 0 = 不限(交由系统层 fd/内存/端口兜底);均可在控制台热改。
# max_mux_streams = 0            # 单复用连接并发流硬顶(0=不限;新会话生效;QUIC 需重启)
# max_data_conns_per_client = 0  # 每客户端并发数据通道(0=不限;立即生效;自动钳制到流上限-1024)
# max_udp_sessions_per_proxy = 0 # 每规则 UDP 会话数(0=不限;立即生效)
# max_pool_size = 0              # 每规则池深上限(0=不限;仅新建/更新规则生效)
default_pool_size = 2
# control_send_queue = 256       # 控制帧发送队列(满则背压;新会话生效)
# unauth_conns_per_ip = 64       # 每 IP 认证窗口并发(0=不限;防匿名洪水,不建议关)
# udp_packet_size = 65536        # UDP 报文缓冲(实际取 max(1500, 此值))
# pool_wait_timeout_ms = 10000   # 用户连接等池补拨总时长

[ssh_gateway]
enabled = false

[metrics]
# Prometheus 独立端口(无鉴权,默认仅本机可达)
enable_prometheus = false
bind_addr = "127.0.0.1"
port = 9100

[log]
level = "info"
